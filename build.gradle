buildscript {
	repositories {
		maven { url = uri("https://plugins.gradle.org/m2/") }
		maven { url = uri("https://repo.spring.io/libs-release/") }
		mavenCentral()
		maven { url = uri("https://repo.spring.io/milestone/") }
	}
	// Force-patch BouncyCastle transitives pulled in by buildscript plugins
	// (axion-release-plugin transitively requires jgit, which requires
	// bcprov-jdk18on). The dependency-review job rejects CVE-2025-14813
	// (critical) and CVE-2026-5598 (high) in 1.82; force every BouncyCastle
	// module to the patched 1.85 on the buildscript classpath.
	configurations.classpath {
		resolutionStrategy {
			force 'org.bouncycastle:bcprov-jdk18on:1.85'
			force 'org.bouncycastle:bcpkix-jdk18on:1.85'
			force 'org.bouncycastle:bcpg-jdk18on:1.85'
			force 'org.bouncycastle:bcutil-jdk18on:1.85'
			// jib-gradle-plugin 3.5.3 pulls Jackson 2.15.2 (jackson-bom,
			// jackson-core, jackson-databind, jackson-datatype-jsr310). Dependabot
			// flags many CVEs in jackson-core/databind <= 2.18.10; first patched
			// is 2.18.11. Force every Jackson 2 module on the buildscript classpath
			// to 2.18.12. jackson-annotations is intentionally NOT forced: Jackson 3
			// (spring-boot-buildpack-platform) already resolves it to 2.21.
			force 'com.fasterxml.jackson:jackson-bom:2.18.12'
			force 'com.fasterxml.jackson.core:jackson-core:2.18.12'
			force 'com.fasterxml.jackson.core:jackson-databind:2.18.12'
			force 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.12'
			// jib-gradle-plugin (and google-http-client, google-auth-library) pulls
			// guava 32.1.2-jre. CVE-2026-102554 (high) affects <= 33.7.1.
			force 'com.google.guava:guava:33.7.2-jre'
			// spring-boot-buildpack-platform -> commons-compress 1.27.1 pulls
			// commons-lang3 3.16.0. CVE-2025-48924 affects < 3.18.0; align with the
			// 3.20.0 already pinned for the app in dependencyManagement.
			force 'org.apache.commons:commons-lang3:3.20.0'
			// spring-boot-gradle-plugin -> spring-boot-buildpack-platform requests
			// Jackson 3.1.4. Dependency Review records that classpath node.
			// GHSA-p6pp-m3f8-5c89, GHSA-7hhh-6rmp-j9qf. GitHub marks <= 3.1.6 vulnerable; first patched is 3.1.7.
			dependencySubstitution {
				substitute module('tools.jackson.core:jackson-core:3.1.4') using module('tools.jackson.core:jackson-core:3.1.7')
				substitute module('tools.jackson.core:jackson-databind:3.1.4') using module('tools.jackson.core:jackson-databind:3.1.7')
				substitute module('tools.jackson:jackson-bom:3.1.4') using module('tools.jackson:jackson-bom:3.1.7')
			}
			eachDependency { details ->
				def group = details.requested.group
				if (group != null && (group == 'tools.jackson' || group.startsWith('tools.jackson.')) && details.requested.version in ['3.1.4', '3.1.6']) {
					details.useVersion('3.1.7')
					details.because('Replace vulnerable Jackson 3.1.4')
				}
			}
		}
	}
}

plugins {
	id 'org.springframework.boot' version '4.1.2'
	id "io.spring.dependency-management" version "1.1.7"
	id 'com.google.cloud.tools.jib' version '3.5.3'
	id 'pl.allegro.tech.build.axion-release' version '1.21.2'
	id 'java'
	id "application"
}

group = 'io.dnsmonitor.dns'

// Derive project.version from the nearest git tag (default: 0.1.0).
// Tag format is "v<version>" matching existing tags (v5.0.1, v5.1.0, ...).
// Off-tag versions are decorated with the short commit SHA instead of the
// branch name, and the snapshot suffix is `-rc` (not `-SNAPSHOT`).
// Override at release time via:
//   ./gradlew markNextVersion -Prelease.version=5.2.0
scmVersion {
	tag {
		prefix = 'v'
		versionSeparator = ''
	}
	// Decorate non-main commits with the short SHA (e.g. 5.1.0-c143976)
	// instead of the default branch-name decoration.
	versionCreator('versionWithCommitHash')
	// Use -rc instead of the default -SNAPSHOT suffix.
	// The snapshot creator's return value is appended to the decorated
	// version, so we return just the suffix.
	snapshotCreator({ v, position -> '-rc' })
	// Match Reckon's old behaviour of restricting the "release" flow to the
	// main branch. Tags outside main are still detected (and used to set
	// project.version) but the `release` task refuses to run on them.
	releaseOnlyOnReleaseBranches = true
	releaseBranchNames = ['main']
}

// Apply the resolved version to the project so Jib (and other consumers of
// project.version) see it.
version = scmVersion.version

ext {
	set('spring-cloud.version', "2025.1.4")

	set('commons-lang3.version', '3.20.0')
}

application {
	mainClass.set("io.dnsmonitor.dns.client.DnsClientApplication")
}

jar {
	enabled = false
}

// Rewrite module metadata that still requests tools.jackson* 3.1.4 so the
// resolved graph and the dependencies report do not contain that version.
// spring-boot-jackson 4.0.7 hardcodes jackson-databind 3.1.4.
abstract class AlignJackson314Rule implements ComponentMetadataRule {
	void execute(ComponentMetadataContext context) {
		context.details.allVariants {
			withDependencies { deps ->
				def replacements = []
				for (dep in new ArrayList(deps)) {
					def group = dep.group
					def required = dep.versionConstraint?.requiredVersion
					if (required in ['3.1.4', '3.1.6'] && group != null && (group == 'tools.jackson' || group.startsWith('tools.jackson.'))) {
						replacements << [group, dep.name]
					}
				}
				replacements.unique().each { group, name ->
					deps.removeAll { it.group == group && it.name == name && it.versionConstraint.requiredVersion in ['3.1.4', '3.1.6'] }
					deps.add("${group}:${name}:3.1.7")
				}
			}
		}
	}
}

configurations.configureEach { configuration ->
	configuration.resolutionStrategy.dependencySubstitution {
		substitute module('tools.jackson.core:jackson-core:3.1.4') using module('tools.jackson.core:jackson-core:3.1.7')
		substitute module('tools.jackson.core:jackson-databind:3.1.4') using module('tools.jackson.core:jackson-databind:3.1.7')
		substitute module('tools.jackson:jackson-bom:3.1.4') using module('tools.jackson:jackson-bom:3.1.7')
	}
	configuration.resolutionStrategy.eachDependency { details ->
		def group = details.requested.group
		if (group != null && (group == 'tools.jackson' || group.startsWith('tools.jackson.')) && details.requested.version in ['3.1.4', '3.1.6']) {
			details.useVersion('3.1.7')
			details.because('Replace vulnerable Jackson 3.1.4')
		}
	}
}

dependencies {
	components {
		all(AlignJackson314Rule)
	}

	// Spring Boot starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Observability and monitoring
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    //TODO: add implementation 'io.micrometer:micrometer-registry-prometheus' // For Prometheus metrics

    implementation 'dnsjava:dnsjava'
    implementation 'org.apache.commons:commons-text'
	implementation 'org.apache.commons:commons-lang3'

    // Annotations for static analysis
    implementation 'com.github.spotbugs:spotbugs-annotations:4.9.8' // Modern replacement for JSR305
    compileOnly 'org.jetbrains:annotations:26.1.0' // JetBrains annotations for better IDE support

    // Test dependencies
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.xmlunit:xmlunit-core:2.11.0'
	testImplementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
	testImplementation('org.springframework.boot:spring-boot-starter-test') {
		exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
	}

	// Test runtime
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {dm ->
	applyMavenExclusions = false
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${ext.get('spring-cloud.version')}"
	}
	dependencies {
		dependency 'dnsjava:dnsjava:3.6.5'
		dependency 'org.apache.commons:commons-text:1.15.0'
		dependency 'org.apache.commons:commons-lang3:3.20.0'
		dependency 'org.bouncycastle:bcpkix-jdk18on:1.85'
		// Pin BouncyCastle modules to 1.85 to override vulnerable transitives
		// pulled in by axion-release-plugin (via jgit). Without this the
		// dependency-review job fails on CVE-2025-14813 (critical) and
		// CVE-2026-5598 (high) in bcprov-jdk18on 1.82.
		dependency 'org.bouncycastle:bcprov-jdk18on:1.85'
		dependency 'org.bouncycastle:bcpg-jdk18on:1.85'
		dependency 'org.bouncycastle:bcutil-jdk18on:1.85'
	}

}



java {
	sourceCompatibility = 25
	targetCompatibility = 25
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
		vendor = JvmVendorSpec.BELLSOFT
	}
}

test {
	useJUnitPlatform()
}

// Resolve the project version to a String once, at configuration time, so
// the Jib configuration closure can reference a plain String instead of
// capturing the org.gradle.api.Project instance (which is not serializable
// under the configuration cache).
def imageVersion = version.toString()

jib {
	from {
		image = 'bellsoft/liberica-runtime-container:jre-25-glibc' // Alpaquita Linux (glibc), JRE 25
	}
	to {
		image = 'europe-docker.pkg.dev/dnsmonitor/containers/dns-client'

		tags = imageVersion.contains("-rc") ? ['latest'] : [imageVersion, 'latest']
	}
	container {
		mainClass = "io.dnsmonitor.dns.client.DnsClientApplication"
		ports = ['8001']
		format = 'OCI'

		creationTime = 'USE_CURRENT_TIMESTAMP'
	}
	allowInsecureRegistries = false
}

// Jib 3.5.x captures the org.gradle.api.Project instance in its
// configuration-time closures, which the configuration cache refuses to
// serialise. Mark all Jib tasks as not configuration-cache compatible
// until upstream fixes
// https://github.com/GoogleContainerTools/jib/issues/3132 (open since
// 2021, still unresolved in 3.5.4). Without this the build fails with
// "Cannot invoke Project.getProjectDir() because this.project is null".
// All other tasks still benefit from the configuration cache.
tasks.withType(com.google.cloud.tools.jib.gradle.JibTask).configureEach {
	notCompatibleWithConfigurationCache(
		"https://github.com/GoogleContainerTools/jib/issues/3132")
}
